function syllabusView(){const n=mastered();let html=head('YOUR LEARNING MAP','Syllabus','12 phases. One clear view of where you are.','<button class="btn outline" onclick="document.getElementById(\'topicSearch\').focus()">⌕ Find a topic</button>');html+=`<div class="panel phase-overview"><div class="ring" style="--p:${pct(n,allTopics.length)*3.6}deg"><div class="ringin"><b>${pct(n,allTopics.length)}%</b><small>mastered</small></div></div><div style="flex:1"><h3>Your progress, at a glance</h3><p>${n} of ${allTopics.length} main topics marked mastered</p><div class="segbar">${phases.map(p=>{const done=p.topics.filter((_,i)=>pStat(`p${p.n}-t${i+1}`)==='Mastered').length;return `<span style="flex:${p.topics.length};background:${done?p.color:'#e9edf5'};opacity:${done?.9:1}"></span>`}).join('')}</div><small style="font-size:9px;color:#8791a5">DSA stays available as a parallel learning track.</small></div></div><div class="toolrow"><input class="search" id="topicSearch" placeholder="⌕ Search topics, phases, or skill tags…" value="${escapeHtml(search)}" oninput="search=this.value;renderSyllabusList()"><div style="font-size:9px;color:#79849a;white-space:nowrap">● Mastered　● In progress　● Revise</div></div><div class="phase-list" id="phaseList">${phaseListHtml()}</div><div class="footer-note">✧ <span>Mastery is a self-assessment, not just a checkbox. Update a topic's status when your understanding changes.</span></div>`;return html}
function phaseListHtml(){return phases.filter(p=>!search||`${p.name} ${p.tags.join(' ')} ${p.topics.join(' ')}`.toLowerCase().includes(search.toLowerCase())).map(p=>{const done=p.topics.filter((_,i)=>pStat(`p${p.n}-t${i+1}`)==='Mastered').length;const open=phaseOpen===p.n||Boolean(search);return `<div class="panel phase-card"><button class="phase-head" onclick="phaseOpen=${open&&!search?null:p.n};renderSyllabusList()"><span class="phase-no" style="background:${p.color}17;color:${p.color}">${String(p.n).padStart(2,'0')}</span><span class="phase-text"><strong>${p.name}</strong><small>${p.weeks} · ${p.topics.length} topics</small></span><span class="phase-pct">${pct(done,p.topics.length)}%</span><span style="color:#9ba4b6">${open?'⌄':'›'}</span></button><div class="phasebar"><span style="width:${pct(done,p.topics.length)}%;background:${p.color}"></span></div>${open?`<div class="topics">${p.topics.map((t,i)=>{const id=`p${p.n}-t${i+1}`,s=pStat(id);return `<div class="topicrow"><span class="topicdot ${s==='Mastered'?'mastered':s==='In Progress'?'progress':s==='Needs Revision'?'revision':''}">${s==='Mastered'?'✓':s==='In Progress'?'•':s==='Needs Revision'?'↘':''}</span><span class="topicname">${t}</span><select onchange="setTopic('${id}',this.value)" aria-label="${t} status">${['Not Started','In Progress','Needs Revision','Mastered'].map(v=>`<option ${s===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}</div>`:''}<div class="phase-tags">${p.tags.map(tag=>`<span>${tag}</span>`).join('')}</div></div>`}).join('')}
function renderSyllabusList(){const el=document.getElementById('phaseList');if(el)el.innerHTML=phaseListHtml()}
function setTopic(id,s){data.status[id]=s;save();renderSyllabusList();toast(`${topicName(id)} · ${s}`);}
function tasksView(){const today=new Date().toISOString().slice(0,10);const done=data.tasks.filter(t=>t.done).length;const list=data.tasks.filter(t=>`${t.title} ${t.description} ${topicName(t.topic)}`.toLowerCase().includes(search.toLowerCase())).filter(t=>taskFilter==='Today'?!t.done&&(!t.due||t.due<=today):taskFilter==='Upcoming'?!t.done&&t.due>today:taskFilter==='Overdue'?!t.done&&t.due&&t.due<today:taskFilter==='Completed'?t.done:true).sort((a,b)=>Number(a.done)-Number(b.done)||({High:0,Medium:1,Low:2}[a.priority]-{High:0,Medium:1,Low:2}[b.priority]));return `${head('MAKE SPACE FOR WHAT MATTERS','Tasks',`${done} completed · ${data.tasks.length-done} left in your list`,'<button class="btn" onclick="openTask()">＋ New task</button>')}<div class="panel tasks-summary"><div class="stat-icon">✓</div><div style="flex:1"><strong style="font-size:12px">You’ve got this.</strong><p>Keep tasks small, clear, and connected to a topic.</p></div><div style="text-align:right"><b style="font:800 22px Manrope">${done}/${data.tasks.length}</b><p>done</p></div></div><div class="toolrow"><input class="search" value="${escapeHtml(search)}" placeholder="⌕ Search your tasks…" oninput="search=this.value;renderTaskList()"><div class="filters">${['Today','Upcoming','Overdue','Completed','All'].map(f=>`<button class="${taskFilter===f?'sel':''}" onclick="taskFilter='${f}';renderTaskList()">${f}${f==='Today'?` · ${data.tasks.filter(t=>!t.done&&(!t.due||t.due<=today)).length}`:''}</button>`).join('')}</div></div><div class="phase-list" id="taskList">${taskListHtml(list)}</div>`}
function taskListHtml(list){if(!list.length)return `<div class="panel empty"><div class="empty-icon">☷</div><h3>Nothing on this list</h3><p>Add a task or switch to another view.</p><button class="btn" style="margin-top:15px" onclick="openTask()">Create a task</button></div>`;return list.map(t=>`<div class="panel task-card"><button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button><div style="flex:1;min-width:0;cursor:pointer" onclick="openTask('${t.id}')"><h3 style="${t.done?'text-decoration:line-through;color:#8f99ab':''}">${escapeHtml(t.title)}</h3><p>${escapeHtml(t.description||topicName(t.topic))}</p><div class="meta"><span class="tag">${escapeHtml(topicName(t.topic))}</span><span class="prio">● ${t.priority}</span>${t.due?`<span class="prio">▦ ${t.due===new Date().toISOString().slice(0,10)?'Today':t.due}</span>`:''}${t.recurrence?`<span class="tag">↻ ${t.recurrence}</span>`:''}</div></div><div class="taskcard-actions"><button title="Edit" onclick="openTask('${t.id}')">⋯</button><button title="Delete" onclick="deleteTask('${t.id}')">⌫</button></div></div>`).join('')}
function renderTaskList(){const el=document.getElementById('taskList');if(el){const today=new Date().toISOString().slice(0,10),list=data.tasks.filter(t=>`${t.title} ${t.description} ${topicName(t.topic)}`.toLowerCase().includes(search.toLowerCase())).filter(t=>taskFilter==='Today'?!t.done&&(!t.due||t.due<=today):taskFilter==='Upcoming'?!t.done&&t.due>today:taskFilter==='Overdue'?!t.done&&t.due&&t.due<today:taskFilter==='Completed'?t.done:true).sort((a,b)=>Number(a.done)-Number(b.done)||({High:0,Medium:1,Low:2}[a.priority]-{High:0,Medium:1,Low:2}[b.priority]));el.innerHTML=taskListHtml(list);}}
function toggleTask(id){const t=data.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render();toast(t?.done?'Task completed!':'Task reopened.')}function deleteTask(id){data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('Task deleted')}
function notesView(){return `${head('YOUR SECOND BRAIN','Notes','Catch a thought before it disappears.','<button class="btn" onclick="openNote()">＋ New note</button>')}<div class="toolrow"><input class="search" value="${escapeHtml(search)}" placeholder="⌕ Search notes…" oninput="search=this.value;renderNoteList()"><div class="filters">${['All notes','Pinned'].map(f=>`<button class="${noteFilter===f?'sel':''}" onclick="noteFilter='${f}';renderNoteList()">${f}</button>`).join('')}</div></div><div class="notes-grid" id="noteGrid">${noteListHtml()}</div><div class="footer-note">☁ <span>Preview notes are stored in this browser only. Cloud sync will be enabled in the connected app after its dedicated Supabase project is configured.</span></div>`}
function noteListHtml(){const list=data.notes.filter(n=>`${n.title} ${n.content} ${topicName(n.topic)}`.toLowerCase().includes(search.toLowerCase())&&(noteFilter==='All notes'||n.pinned)).sort((a,b)=>Number(b.pinned)-Number(a.pinned));if(!list.length)return `<div class="panel empty"><div class="empty-icon">▤</div><h3>A fresh page</h3><p>Keep insights, code snippets, and things to revisit here.</p><button class="btn" style="margin-top:14px" onclick="openNote()">Write your first note</button></div>`;return list.map((n,i)=>`<div class="panel note-card"><div class="note-top"><span class="stat-icon">✎</span><div><button title="${n.pinned?'Unpin':'Pin'} note" onclick="pinNote('${n.id}')">${n.pinned?'📌':'♧'}</button><button title="Delete" onclick="deleteNote('${n.id}')">×</button></div></div><h3>${escapeHtml(n.title||'Untitled note')}</h3><div class="note-content" onclick="openNote('${n.id}')">${escapeHtml(n.content||'No content yet.')}</div><div class="note-foot"><span>${escapeHtml(topicName(n.topic))}</span><span>${new Date(n.updated).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></div></div>`).join('')}
function renderNoteList(){const el=document.getElementById('noteGrid');if(el)el.innerHTML=noteListHtml()}function pinNote(id){const n=data.notes.find(n=>n.id===id);if(n)n.pinned=!n.pinned;save();renderNoteList();toast(n?.pinned?'Note pinned':'Note unpinned')}function deleteNote(id){if(confirm('Delete this note?')){data.notes=data.notes.filter(n=>n.id!==id);save();render();toast('Note deleted')}}
function focusView(){const total=data.sessions.reduce((a,s)=>a+s.mins,0),mins=Math.floor(remaining/60).toString().padStart(2,'0'),secs=(remaining%60).toString().padStart(2,'0'),elapsed=1-remaining/(timerLength*60||1);return `${head('BE HERE, RIGHT NOW','Focus','One task. One session. Less noise.','<button class="btn outline" onclick="openSettings()">♧ Reminders</button>')}<div class="focus-grid"><div class="panel timerpanel"><div class="focus-state"><span>${timerOn?'● SESSION IN PROGRESS':'YOUR FOCUS SPACE'}</span><button class="icon-btn" onclick="openHistory()">◷</button></div><div class="timerwheel" style="--tp:${Math.max(0,elapsed*360)}deg"><div class="timerinside"><small>${timerOn?'IN THE ZONE':'TIME TO FOCUS'}</small><strong id="clock">${mins}:${secs}</strong><span>${timerOn?'You’re doing great':'Make this time count'}</span></div></div><div class="presets">${[15,25,45,60].map(m=>`<button class="${m===timerLength?'sel':''}" ${timerOn?'disabled':''} onclick="setTimer(${m})">${m}<small>m</small></button>`).join('')}</div><div class="timer-controls"><button class="btn" onclick="toggleTimer()">${timerOn?'Ⅱ Pause session':remaining===0?'↻ Start again':'▶ Start focusing'}</button><button class="reset" onclick="resetTimer()">↺</button></div><p style="font-size:9px;color:#8b96aa;margin-top:15px">Stay with it. Breaks are part of the process.</p></div><div class="rightstack"><div class="panel sidecard"><h3>What are you working on?</h3><p>Log time against a topic.</p><select onchange="focusTopic=this.value">${phases.map(p=>`<optgroup label="${p.name}">${p.topics.map((t,i)=>`<option value="p${p.n}-t${i+1}" ${focusTopic===`p${p.n}-t${i+1}`?'selected':''}>${t}</option>`).join('')}</optgroup>`).join('')}</select><div class="reminder-line"><span class="rem-icon">⌘</span><div><strong>${topicName(focusTopic)}</strong><small>Selected focus topic</small></div></div></div><div class="panel sidecard"><h3>Your focus history</h3><p>Every session counts.</p><div class="focuscounts"><div><b>${data.sessions.length}</b><small>Sessions</small></div><div><b>${Math.floor(total/60)}h ${total%60}m</b><small>Total time</small></div><div><b>${data.sessions.filter(s=>s.done).length}</b><small>Completed</small></div></div><button class="btn outline" style="width:100%" onclick="openHistory()">View session history</button></div><div class="panel mini-callout">✧ <span><b>A tiny focus ritual</b><br>Write the next action before starting. When the timer ends, jot one thing you learned.</span></div></div></div>`}
function updateClock(){if(view!=='focus')return;const el=document.getElementById('clock');if(el)el.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;const wheel=document.querySelector('.timerwheel');if(wheel)wheel.style.setProperty('--tp',`${Math.max(0,(1-remaining/(timerLength*60||1))*360)}deg`);const inside=document.querySelector('.timerinside small');if(inside)inside.textContent=timerOn?'IN THE ZONE':'TIME TO FOCUS';const caption=document.querySelector('.timerinside span');if(caption)caption.textContent=timerOn?'You’re doing great':'Make this time count';const main=document.querySelector('.timer-controls .btn');if(main)main.textContent=timerOn?'Ⅱ Pause session':remaining===0?'↻ Start again':'▶ Start focusing';}
function setTimer(m){timerLength=m;remaining=m*60;timerOn=false;if(timerInterval)clearInterval(timerInterval);render()}function startTimer(){timerOn=true;if(remaining===0)remaining=timerLength*60;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{if(!timerOn)return;if(remaining>0)remaining--;updateClock();if(remaining<=0){timerOn=false;clearInterval(timerInterval);data.sessions.unshift({id:crypto.randomUUID?.()||String(Date.now()),topic:focusTopic,mins:timerLength,date:new Date().toISOString().slice(0,10),done:true});save();toast('Focus session complete. Nicely done!');render()}},1000);updateClock()}function toggleTimer(){if(timerOn){timerOn=false;updateClock()}else startTimer()}function resetTimer(){timerOn=false;if(timerInterval)clearInterval(timerInterval);remaining=timerLength*60;render()}
function modal(content){document.getElementById('modal').innerHTML=content;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show');reasonAction=null}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function topicSelect(selected){return phases.map(p=>`<optgroup label="${p.name}">${p.topics.map((t,i)=>`<option value="p${p.n}-t${i+1}" ${selected===`p${p.n}-t${i+1}`?'selected':''}>${t}</option>`).join('')}</optgroup>`).join('')}
function openTask(id){const t=data.tasks.find(t=>t.id===id);modal(`<div class="modal-head"><span class="modal-icon">☑</span><div><h3>${t?'Edit task':'Create a task'}</h3><p>A small next step is a good next step.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveTaskForm(event,'${t?.id||''}')"><div class="field"><label>Task title</label><input id="taskTitle" required maxlength="160" value="${escapeHtml(t?.title||'')}" placeholder="e.g. Practise binary search" autofocus></div><div class="field"><label>Notes (optional)</label><textarea id="taskDescription" placeholder="What does done look like?">${escapeHtml(t?.description||'')}</textarea></div><div class="row2"><div class="field"><label>Due date</label><input id="taskDue" type="date" value="${t?.due||''}"></div><div class="field"><label>Priority</label><select id="taskPriority">${['Low','Medium','High'].map(p=>`<option ${t?.priority===p?'selected':(!t&&p==='Medium')?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="field"><label>Link to topic</label><select id="taskTopic">${topicSelect(t?.topic||'p1-t1')}</select></div><div class="field"><label>Repeat</label><select id="taskRepeat">${['Never','Daily','Weekdays','Weekly'].map(p=>`<option ${t?.recurrence===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">${t?'Save changes':'Add task'}</button></div></form>`)}
function saveTaskForm(e,id){e.preventDefault();const obj={id:id||`t${Date.now()}`,title:document.getElementById('taskTitle').value.trim(),description:document.getElementById('taskDescription').value.trim(),due:document.getElementById('taskDue').value,priority:document.getElementById('taskPriority').value,topic:document.getElementById('taskTopic').value,recurrence:document.getElementById('taskRepeat').value,done:false};if(id){const old=data.tasks.find(t=>t.id===id);obj.done=old?.done||false;data.tasks=data.tasks.map(t=>t.id===id?obj:t)}else data.tasks.unshift(obj);save();closeModal();render();toast(id?'Task updated':'Task added')}
function openNote(id){const n=data.notes.find(n=>n.id===id);modal(`<div class="modal-head"><span class="modal-icon" style="background:#fff0e5;color:#c87935">✎</span><div><h3>${n?'Edit note':'A fresh page'}</h3><p>Capture an idea while it's still fresh.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveNoteForm(event,'${n?.id||''}')"><div class="field"><label>Note title</label><input id="noteTitle" value="${escapeHtml(n?.title||'')}" placeholder="e.g. DSA patterns I keep mixing up"></div><div class="field"><label>Your note</label><textarea id="noteContent" style="min-height:170px" placeholder="Write a concept, snippet, mistake, or reminder…">${escapeHtml(n?.content||'')}</textarea></div><div class="field"><label>Link to topic</label><select id="noteTopic">${topicSelect(n?.topic||'p1-t1')}</select></div><label style="font-size:11px;display:flex;align-items:center;gap:9px;color:#59667d"><input type="checkbox" id="notePinned" ${n?.pinned?'checked':''}> Pin this note</label><div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save note</button></div></form>`)}function saveNoteForm(e,id){e.preventDefault();const n={id:id||`n${Date.now()}`,title:document.getElementById('noteTitle').value.trim()||'Untitled note',content:document.getElementById('noteContent').value,topic:document.getElementById('noteTopic').value,pinned:document.getElementById('notePinned').checked,updated:new Date().toISOString()};data.notes=id?data.notes.map(x=>x.id===id?n:x):[n,...data.notes];save();closeModal();render();toast('Note saved')}
function openSettings(){modal(`<div class="modal-head"><span class="modal-icon">⚙</span><div><h3>Your Orbit settings</h3><p>Make your workspace work for you.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="panel" style="padding:15px;box-shadow:none;border-radius:16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b style="font-size:12px">Study check-in reminders</b><div style="font-size:10px;color:#758097;margin-top:4px">Choose a rhythm that works for you.</div></div><button class="btn ${data.reminders.enabled?'outline':''}" style="padding:8px 11px;font-size:10px" onclick="reminderToggle()">${data.reminders.enabled?'Turn off':'Turn on'}</button></div><hr style="border:0;border-top:1px solid #edf0f6;margin:16px 0"><div class="eyebrow">REMIND ME EVERY</div><div class="filters" style="display:grid;grid-template-columns:repeat(4,1fr)">${[[30,'30 min'],[60,'1 hour'],[120,'2 hours'],[180,'3 hours']].map(([v,l])=>`<button class="${data.reminders.interval===v?'sel':''}" onclick="setReminderInterval(${v})">${l}</button>`).join('')}</div><div class="row2" style="margin-top:15px"><div class="field"><label>Active from</label><input type="time" id="rStart" value="${data.reminders.start}"></div><div class="field"><label>Active until</label><input type="time" id="rEnd" value="${data.reminders.end}"></div></div><button class="btn outline" style="width:100%" onclick="saveReminderTimes()">Save active hours</button><p style="font-size:9px;color:#8793a8;line-height:1.55;margin:12px 0 0">Turning reminders off or dismissing a check-in asks for a reason. Device settings may still allow system notifications to be swiped away.</p></div><div class="panel" style="padding:15px;margin-top:13px;box-shadow:none"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b style="font-size:12px">Reminder history</b><p style="font-size:10px;color:#758097;margin:4px 0 0">Review check-ins and recorded reasons.</p></div><button class="btn outline" style="padding:8px 11px;font-size:10px" onclick="openHistory()">View</button></div></div><div class="notice">Preview mode stores data in this browser only. Cloud sync is not connected in this file. Export a backup before clearing browser storage.</div><div class="modal-actions"><button class="btn outline" onclick="exportData()">Export data ↓</button><button class="btn" onclick="closeModal()">Done</button></div>`)}
async function reminderToggle(){if(data.reminders.enabled){closeModal();openReason('disabled');return}let allowed=true;if('Notification'in window){if(Notification.permission==='default')allowed=await Notification.requestPermission()==='granted';else allowed=Notification.permission==='granted'}if(!allowed){toast('Notifications are blocked in this browser');return}data.reminders.enabled=true;localStorage.setItem('sde-orbit-last-reminder',String(Date.now()));save();closeModal();render();toast('Reminders enabled.')}function setReminderInterval(v){data.reminders.interval=Number(v);save();openSettings()}function saveReminderTimes(){const start=document.getElementById('rStart').value,end=document.getElementById('rEnd').value;if(!start||!end||start>=end){toast('Choose an end time after the start time');return}data.reminders.start=start;data.reminders.end=end;save();closeModal();render();toast('Active hours updated')}
function openReason(action){reasonAction=action;reasonPick='Taking a short break';reasonOther='';const label=action==='disabled'?'turn reminders off':action==='snoozed'?'snooze this reminder':action==='skipped'?'skip this check-in':action==='paused'?'pause this check-in':'complete this check-in';renderReason(label)}function renderReason(label){modal(`<div class="modal-head"><span class="modal-icon" style="background:#e5f7f1;color:#139a78">♧</span><div><h3>Before you ${label}</h3><p>Your reason helps you understand your habits later.</p></div><button class="close" onclick="closeModal()">×</button></div><p class="reason-desc">Choose the closest match. This entry will be added to your activity history.</p><div class="reason-options">${['Taking a short break','Working on another task','Need more time','Not feeling well','Completed my planned work','Other'].map(r=>`<button class="reason-opt ${reasonPick===r?'sel':''}" onclick="pickReason('${r}')"><span class="radio"></span>${r}</button>`).join('')}</div>${reasonPick==='Other'?`<div class="field" style="margin-top:13px"><label>Tell us why</label><textarea id="reasonOther" oninput="reasonOther=this.value" placeholder="Enter a reason…">${escapeHtml(reasonOther)}</textarea></div>`:''}<div class="modal-actions"><button class="btn outline" onclick="closeModal()">Go back</button><button class="btn" onclick="submitReason()" ${reasonPick==='Other'&&!reasonOther.trim()?'disabled':''}>Save reason</button></div>`)}function pickReason(r){reasonPick=r;renderReason(reasonAction==='disabled'?'turn reminders off':reasonAction==='snoozed'?'snooze this reminder':reasonAction==='skipped'?'skip this check-in':reasonAction==='paused'?'pause this check-in':'complete this check-in')}
function submitReason(){const why=reasonPick==='Other'?document.getElementById('reasonOther')?.value.trim():reasonPick;if(!why){toast('Please enter a reason');return}data.history.unshift({id:`h${Date.now()}`,kind:reasonAction,reason:why,at:new Date().toISOString()});if(reasonAction==='disabled')data.reminders.enabled=false;const act=reasonAction;save();closeModal();render();toast(act==='disabled'?'Reminders turned off. Reason saved.':act==='snoozed'?'Reminder snoozed for 15 minutes.':'Response recorded.');if(act==='snoozed')setTimeout(()=>{if(data.reminders.enabled){openReminder()}},15*60*1000)}function openReminder(){modal(`<div style="text-align:center;padding:8px 5px 13px"><span style="width:52px;height:52px;border-radius:18px;background:#edf2ff;color:#3563e9;display:grid;place-items:center;margin:auto;font-size:22px">♧</span><h2 style="font:800 25px Manrope;letter-spacing:-.05em;margin:15px 0 0">A little check-in</h2><p style="font-size:11px;color:#758097;margin:7px 0 0">What’s happening right now?</p></div><div class="notice" style="text-align:center"><b>No judgement. Just awareness.</b><br>Record a reason to close this reminder. It becomes part of your history.</div><button class="btn" style="width:100%;margin:5px 0" onclick="closeModal();openReason('completed')">✓ I’m on track</button><button class="btn outline" style="width:100%;margin:5px 0" onclick="closeModal();openReason('snoozed')">◷ Snooze for 15 minutes</button><button style="width:100%;border:0;background:none;padding:12px;color:#748098;font-weight:800;font-size:11px" onclick="closeModal();openReason('skipped')">Skip this check-in</button>`)}function openHistory(){const items=[...data.history,...data.sessions.map(s=>({id:s.id,kind:'completed',reason:`Focus session · ${s.mins} minutes on ${topicName(s.topic)}`,at:s.date}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,50);modal(`<div class="modal-head"><span class="modal-icon" style="background:#e5f7f1;color:#139a78">◷</span><div><h3>Your activity history</h3><p>A record of showing up, your way.</p></div><button class="close" onclick="closeModal()">×</button></div>${items.length?items.map(i=>`<div class="history-row"><span class="history-marker">${i.kind==='completed'?'✓':i.kind==='skipped'?'×':'◷'}</span><div style="flex:1"><strong>${i.kind==='completed'?'Completed / checked in':i.kind==='skipped'?'Skipped check-in':i.kind==='snoozed'?'Reminder snoozed':i.kind==='disabled'?'Reminders turned off':'Reminder paused'}</strong><p>${escapeHtml(i.reason)}</p><small>${new Date(i.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="empty"><div class="empty-icon">◷</div><h3>Your history starts here</h3><p>Check-ins and focus sessions appear here.</p></div>'}<div class="modal-actions"><button class="btn" onclick="closeModal()">Done</button></div>`)}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`sde-orbit-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

setInterval(()=>{if(!data.reminders.enabled)return;const now=new Date(),min=now.getHours()*60+now.getMinutes(),[sh,sm]=data.reminders.start.split(':').map(Number),[eh,em]=data.reminders.end.split(':').map(Number);if(min<sh*60+sm||min>eh*60+em)return;const last=Number(localStorage.getItem('sde-orbit-last-reminder')||'0');if(Date.now()-last>=data.reminders.interval*60000){localStorage.setItem('sde-orbit-last-reminder',String(Date.now()));openReminder();if('Notification'in window&&Notification.permission==='granted')new Notification('Time for a quick check-in',{body:'Open SDE Orbit to record your progress.'})}},30000);
render();
